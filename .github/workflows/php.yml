name: Tests

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: "0 06 * * 1"
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Only 7.4 due to OS EOL constraints
        php: ['7.4']

    # Read by compose.yml for both the build arg and the image tag
    env:
      PHP_VERSION: ${{ matrix.php }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # The image holds no application code, so it only changes when the
    # Dockerfile or the PHP version does.
    - name: Cache SDK image
      id: docker-image
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /tmp/sdk-dev-image.tar
        key: docker-${{ matrix.php }}-${{ hashFiles('Dockerfile') }}

    - name: Load cached SDK image
      if: steps.docker-image.outputs.cache-hit == 'true'
      run: docker load -i /tmp/sdk-dev-image.tar

    - name: Build SDK image
      if: steps.docker-image.outputs.cache-hit != 'true'
      run: |
        docker compose build sdk
        docker save -o /tmp/sdk-dev-image.tar "$(docker compose config --images sdk)"

    # COMPOSER_CACHE_DIR points here, see compose.yml.
    - name: Cache Composer packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .composer-cache
        key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
        restore-keys: composer-${{ matrix.php }}-

    - name: Validate composer.json and composer.lock
      run: docker compose run --rm sdk composer validate --strict

    - name: Install dependencies
      run: docker compose run --rm sdk composer install --prefer-dist --no-progress

    - name: Tests
      run: docker compose run --rm sdk composer run-script test
